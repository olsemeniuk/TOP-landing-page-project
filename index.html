<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page Project</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="top">
    <header class="header">
      <div class="container">
        <div class="header__inner">
          <a class="logo" href="#">Header Logo</a>
          <nav class="nav">
            <ul class="nav__list">
              <li class="nav__item">
                <a class="nav__link" href="#">header link one</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#">header link two</a>
              </li>
              <li class="nav__item">
                <a class="nav__link" href="#">header link three</a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </header>
    <div class="hero">
      <div class="container">
        <div class="hero__inner">
          <div class="hero__content">
            <h1 class="hero__title">This website is awesome</h1>
            <p class="hero__text">This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast</p>
            <a class="hero__link button" href="#">Sign up</a>
          </div>
          <img class="hero__img" src="./images/hero-img.jpg" alt="">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
